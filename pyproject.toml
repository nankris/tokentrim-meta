[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokentrim"
version = "0.3.0"
description = "Cost-aware context middleware for coding agents"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{name = "Nandigam Hari Krishna"}]
dependencies = []

[tool.setuptools.packages.find]
include = ["tokentrim*", "bench"]
exclude = ["bench.tasks_repo*"]

[tool.setuptools.package-data]
tokentrim = ["prices.toml"]
